// ============================================================
// gradle.properties
// Key-value settings that control how Gradle itself behaves.
// These are project-wide JVM and Gradle tuning flags.
// ============================================================

# Gives Gradle's own JVM more memory to avoid "Out of Memory" errors
# during compilation of large projects.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is Google's modern support library namespace.
# Setting this to true means all old 'android.support.*' imports
# are automatically replaced with 'androidx.*' equivalents.
android.useAndroidX=true

# Enables parallel project execution — speeds up multi-module builds.
org.gradle.parallel=true

# Caches build outputs so unchanged modules are not rebuilt.
org.gradle.caching=true
